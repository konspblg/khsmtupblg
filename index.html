<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Dashboard Monitoring KHS MTU 2024</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
  :root {
    --bg: #f5f7fb; --surface: #ffffff; --surface-2: #f0f2f7;
    --text: #1a1f36; --text-muted: #6b7280; --border: #e5e7eb;
    --primary: #2563eb; --primary-hover: #1d4ed8;
    --success: #16a34a; --warning: #f59e0b; --danger: #dc2626;
    --shadow: 0 1px 3px rgba(0,0,0,0.06), 0 1px 2px rgba(0,0,0,0.04);
    --shadow-lg: 0 8px 20px rgba(0,0,0,0.15);
    --row-selected-bg: #fef3c7;
    --row-selected-text: #1a1f36;
    --row-selected-border: #f59e0b;
  }
  [data-theme="dark"] {
    --bg: #0f172a; --surface: #1e293b; --surface-2: #283548;
    --text: #f1f5f9; --text-muted: #94a3b8; --border: #334155;
    --primary: #3b82f6; --primary-hover: #60a5fa;
    --success: #22c55e; --warning: #fbbf24; --danger: #ef4444;
    --shadow: 0 1px 3px rgba(0,0,0,0.4);
    --shadow-lg: 0 8px 20px rgba(0,0,0,0.5);
    --row-selected-bg: #3b3416;
    --row-selected-text: #fde68a;
    --row-selected-border: #fbbf24;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; max-width: 100%; overflow-x: hidden; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: var(--bg); color: var(--text);
    min-height: 100vh; transition: background 0.3s, color 0.3s; line-height: 1.5;
  }

  header {
    background: var(--surface); border-bottom: 1px solid var(--border);
    padding: 1rem 1.25rem; box-shadow: var(--shadow);
    position: sticky; top: 0; z-index: 100; width: 100%;
  }
  .header-inner {
    width: 100%; max-width: 1240px; margin: 0 auto;
    display: flex; flex-direction: column; gap: 0.75rem;
  }
  .title { display: flex; align-items: center; gap: 0.6rem; min-width: 0; width: 100%; }
  .title h1 { font-size: clamp(1rem, 3.5vw, 1.25rem); font-weight: 600; line-height: 1.25; }
  .title .subtitle { font-size: clamp(0.7rem, 2vw, 0.8rem); color: var(--text-muted); }
  .logo {
    width: 40px; height: 40px; flex-shrink: 0;
    background: var(--primary); border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    color: white; font-weight: 700; font-size: 1.1rem;
  }
  .header-actions {
    display: flex; gap: 0.5rem; align-items: center;
    justify-content: flex-end; width: 100%; flex-wrap: wrap;
  }
  .btn {
    padding: 0.5rem 0.85rem; border: 1px solid var(--border); border-radius: 8px;
    background: var(--surface); color: var(--text); cursor: pointer;
    font-size: 0.85rem; transition: all 0.2s;
    display: inline-flex; align-items: center; gap: 0.35rem; white-space: nowrap;
  }
  .btn:hover { background: var(--surface-2); border-color: var(--primary); }
  .btn-primary { background: var(--primary); color: white; border-color: var(--primary); }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }

  /* ===== MAIN: padding fluid kiri-kanan ===== */
  main {
    width: 100%;
    max-width: 1240px;
    margin: 0 auto;
    /* padding kiri-kanan responsif: minimum 1.25rem di HP, sampai 3rem di desktop */
    padding: 1rem clamp(1.25rem, 6vw, 3rem);
  }

  .stats-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(min(100%, 200px), 1fr));
    gap: 0.75rem; margin-bottom: 1.25rem; width: 100%;
  }
  .stat-card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 12px; padding: 1rem 1.25rem; box-shadow: var(--shadow);
    min-width: 0;
  }
  .stat-card .label {
    font-size: 0.75rem; color: var(--text-muted);
    text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 0.5rem;
    word-break: break-word;
  }
  .stat-card .value { font-size: clamp(1.4rem, 4vw, 1.75rem); font-weight: 700; word-break: break-word; }
  .stat-card.primary { border-left: 4px solid var(--primary); }
  .stat-card.success { border-left: 4px solid var(--success); }
  .stat-card.warning { border-left: 4px solid var(--warning); }

  .filters {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 12px; padding: 1rem; margin-bottom: 1.25rem;
    box-shadow: var(--shadow);
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(min(100%, 170px), 1fr));
    gap: 0.75rem; width: 100%;
  }
  .filter-group { display: flex; flex-direction: column; gap: 0.35rem; min-width: 0; }
  .filter-group label {
    font-size: 0.7rem; color: var(--text-muted);
    text-transform: uppercase; letter-spacing: 0.05em; font-weight: 600;
  }
  .filter-group select {
    width: 100%; padding: 0.55rem 0.75rem; border: 1px solid var(--border);
    border-radius: 8px; background: var(--surface); color: var(--text);
    font-size: 0.9rem;
  }
  .filter-group select:focus { outline: none; border-color: var(--primary); }
  .filter-group select:disabled { opacity: 0.5; cursor: not-allowed; }
  .filter-reset { grid-column: 1 / -1; display: flex; justify-content: flex-end; }

  .charts-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(min(100%, 320px), 1fr));
    gap: 1rem; margin-bottom: 1.25rem; width: 100%;
  }
  .chart-card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 12px; padding: 1rem; box-shadow: var(--shadow); min-width: 0;
  }
  .chart-card h3 { font-size: 0.95rem; margin-bottom: 0.75rem; font-weight: 600; }
  .chart-wrapper { position: relative; height: 280px; width: 100%; }

  .table-card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 12px; box-shadow: var(--shadow); overflow: hidden; width: 100%;
  }
  .table-header {
    padding: 0.85rem 1rem; border-bottom: 1px solid var(--border);
    display: flex; justify-content: space-between; align-items: center;
    flex-wrap: wrap; gap: 0.5rem;
  }
  .table-header h3 { font-size: 0.95rem; font-weight: 600; }
  .table-info { font-size: 0.8rem; color: var(--text-muted); }

  .table-scroll {
    overflow-x: auto; overflow-y: auto;
    max-height: 600px;
    -webkit-overflow-scrolling: touch;
    touch-action: pan-x pan-y;
  }
  table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
  thead { background: var(--surface-2); }
  th {
    padding: 0.7rem 0.9rem; text-align: left; font-weight: 600;
    border-bottom: 1px solid var(--border); cursor: pointer;
    user-select: none; white-space: nowrap;
    position: sticky; top: 0; background: var(--surface-2); z-index: 1;
  }
  th:hover { background: var(--border); }
  th .sort-icon { opacity: 0.4; margin-left: 0.25rem; font-size: 0.7rem; }
  th.sort-asc .sort-icon, th.sort-desc .sort-icon { opacity: 1; color: var(--primary); }
  td { padding: 0.7rem 0.9rem; border-bottom: 1px solid var(--border); white-space: nowrap; }
  tbody tr { transition: background 0.15s; cursor: pointer; }
  tbody tr:hover { background: var(--surface-2); }
  tbody tr.highlight-danger { background: rgba(220, 38, 38, 0.08); }
  tbody tr.highlight-warning { background: rgba(245, 158, 11, 0.08); }

  tbody tr.row-selected,
  tbody tr.row-selected:hover,
  tbody tr.row-selected.highlight-warning,
  tbody tr.row-selected.highlight-danger {
    background: var(--row-selected-bg) !important;
    color: var(--row-selected-text);
    box-shadow: inset 4px 0 0 var(--row-selected-border);
    font-weight: 500;
  }

  .loading, .error {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 12px; padding: 2.5rem 1.25rem; text-align: center;
    box-shadow: var(--shadow); width: 100%;
  }
  .spinner {
    border: 4px solid var(--border); border-top: 4px solid var(--primary);
    border-radius: 50%; width: 48px; height: 48px;
    animation: spin 1s linear infinite; margin: 0 auto 1rem;
  }
  @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
  .error h3 { color: var(--danger); margin-bottom: 0.5rem; }
  .error p { color: var(--text-muted); margin-bottom: 1rem; word-break: break-word; }

  .pagination {
    padding: 0.85rem 1rem; border-top: 1px solid var(--border);
    display: flex; justify-content: space-between; align-items: center;
    flex-wrap: wrap; gap: 0.5rem;
  }
  .pagination-info { font-size: 0.8rem; color: var(--text-muted); }
  .pagination-buttons { display: flex; gap: 0.4rem; }

  .hidden { display: none !important; }

  /* ===== Scroll to Top button ===== */
  .scroll-top {
    position: fixed;
    bottom: clamp(1rem, 3vw, 1.75rem);
    right: clamp(1rem, 3vw, 1.75rem);
    width: 48px; height: 48px;
    border-radius: 50%;
    background: var(--primary);
    color: white;
    border: none;
    cursor: pointer;
    box-shadow: var(--shadow-lg);
    display: flex; align-items: center; justify-content: center;
    font-size: 1.4rem;
    opacity: 0;
    pointer-events: none;
    transform: translateY(12px);
    transition: opacity 0.25s ease, transform 0.25s ease, background 0.2s;
    z-index: 200;
  }
  .scroll-top.visible {
    opacity: 1;
    pointer-events: auto;
    transform: translateY(0);
  }
  .scroll-top:hover { background: var(--primary-hover); }
  .scroll-top:active { transform: translateY(0) scale(0.95); }

  @media (max-width: 480px) {
    main { padding: 0.75rem 1.25rem; }
    header { padding: 0.85rem 1.25rem; }
    .title h1 { font-size: 1rem; }
    .logo { width: 36px; height: 36px; font-size: 1rem; }
    .btn { padding: 0.45rem 0.65rem; font-size: 0.8rem; }
    .stat-card { padding: 0.85rem 1rem; }
    .filters, .chart-card { padding: 0.85rem; }
    .chart-wrapper { height: 240px; }
    .scroll-top { width: 44px; height: 44px; font-size: 1.25rem; }
  }
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <div class="title">
      <div class="logo">⚡</div>
      <div style="min-width:0;">
        <h1>Dashboard Monitoring KHS MTU 2024</h1>
        <div class="subtitle">Realtime data dari Google Sheets</div>
      </div>
    </div>
    <div class="header-actions">
      <button class="btn" id="refreshBtn">🔄 Refresh</button>
      <button class="btn" id="themeToggle">🌙 Dark</button>
    </div>
  </div>
</header>

<main>
  <div id="loading" class="loading">
    <div class="spinner"></div>
    <p>Memuat data dari Google Sheets...</p>
  </div>

  <div id="error" class="error hidden">
    <h3>Gagal memuat data</h3>
    <p id="errorMessage">Terjadi kesalahan saat mengambil data.</p>
    <button class="btn btn-primary" onclick="loadData()">Coba Lagi</button>
  </div>

  <div id="dashboard" class="hidden">
    <div class="stats-grid" id="statsGrid"></div>

    <div class="filters">
      <div class="filter-group">
        <label for="filterULTG">ULTG</label>
        <select id="filterULTG"><option value="">Semua ULTG</option></select>
      </div>
      <div class="filter-group">
        <label for="filterGI">Gardu Induk</label>
        <select id="filterGI"><option value="">Semua GI</option></select>
      </div>
      <div class="filter-group">
        <label for="filterPenyedia">Penyedia Jasa Pasang</label>
        <select id="filterPenyedia"><option value="">Semua Penyedia</option></select>
      </div>
      <div class="filter-group">
        <label for="filterMaterial">Material</label>
        <select id="filterMaterial"><option value="">Semua Material</option></select>
      </div>
      <div class="filter-group">
        <label for="filterPabrikan">Pabrikan</label>
        <select id="filterPabrikan"><option value="">Semua Pabrikan</option></select>
      </div>
      <div class="filter-group">
        <label for="filterAHI">AHI</label>
        <select id="filterAHI"><option value="">Semua AHI</option></select>
      </div>
      <div class="filter-reset">
        <button class="btn" id="resetFilters">↺ Reset Filter</button>
      </div>
    </div>

    <div class="charts-grid">
      <div class="chart-card">
        <h3>📊 Jumlah per Kategori</h3>
        <div class="chart-wrapper"><canvas id="barChart"></canvas></div>
      </div>
      <div class="chart-card">
        <h3>🥧 Proporsi Status</h3>
        <div class="chart-wrapper"><canvas id="pieChart"></canvas></div>
      </div>
    </div>

    <div class="table-card">
      <div class="table-header">
        <h3>📋 Data Detail</h3>
        <div class="table-info" id="tableInfo">Menampilkan 0 data</div>
      </div>
      <div class="table-scroll" id="tableScroll">
        <table id="dataTable">
          <thead><tr id="tableHeaderRow"></tr></thead>
          <tbody id="tableBody"></tbody>
        </table>
      </div>
      <div class="pagination">
        <div class="pagination-info" id="paginationInfo"></div>
        <div class="pagination-buttons">
          <button class="btn" id="prevPage">← Prev</button>
          <button class="btn" id="nextPage">Next →</button>
        </div>
      </div>
    </div>
  </div>
</main>

<!-- Scroll to top button -->
<button class="scroll-top" id="scrollTopBtn" title="Kembali ke atas" aria-label="Kembali ke atas">↑</button>

<script>
const SHEET_ID = '1n2rFEUf5O02qZuUqEK9WqID5nC9CGObcokTN2qZ8Sps';
const GID = '1351233736';
const SHEET_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&gid=${GID}`;
const ROWS_PER_PAGE = 25;

let allData = [], filteredData = [], columns = [];
let displayColumns = [];
let currentPage = 1, sortColumn = null, sortDirection = 'asc';
let barChart = null, pieChart = null;

let colULTG, colGI, colPenyedia, colMaterial, colPabrikan, colAHI;
let colJumlah, colTerpasang, colBelum, colStatus, colUPT, colBay;

async function loadData() {
  document.getElementById('loading').classList.remove('hidden');
  document.getElementById('error').classList.add('hidden');
  document.getElementById('dashboard').classList.add('hidden');

  try {
    const response = await fetch(SHEET_URL);
    if (!response.ok) throw new Error(`HTTP ${response.status}`);
    const text = await response.text();
    const jsonStart = text.indexOf('{');
    const jsonEnd = text.lastIndexOf('}') + 1;
    const json = JSON.parse(text.substring(jsonStart, jsonEnd));
    if (!json.table) throw new Error('Format data tidak sesuai');

    parseSheetData(json.table);
    detectImportantColumns();
    buildDisplayColumns();

    if (colMaterial) {
      allData = allData.filter(r => {
        const m = String(r[colMaterial] || '').toUpperCase();
        return !m.includes('SF6');
      });
      filteredData = [...allData];
    }

    initDashboard();
    document.getElementById('loading').classList.add('hidden');
    document.getElementById('dashboard').classList.remove('hidden');
  } catch (err) {
    console.error('Error:', err);
    document.getElementById('loading').classList.add('hidden');
    document.getElementById('error').classList.remove('hidden');
    document.getElementById('errorMessage').textContent =
      `${err.message}. Pastikan spreadsheet sudah di-share "Anyone with the link".`;
  }
}

function parseSheetData(table) {
  columns = table.cols.map((col, i) => col.label || col.id || `Kolom ${i+1}`);
  allData = table.rows.map(row => {
    const obj = {};
    row.c.forEach((cell, i) => {
      let val = '';
      if (cell) {
        if (cell.f !== undefined && cell.f !== null) val = cell.f;
        else if (cell.v !== undefined && cell.v !== null) val = cell.v;
      }
      obj[columns[i]] = val;
    });
    return obj;
  }).filter(row => Object.values(row).some(v => v !== '' && v !== null));
  filteredData = [...allData];
}

function findColumn(keywords) {
  const lower = columns.map(c => c.toLowerCase());
  for (const kw of keywords) {
    const idx = lower.findIndex(c => c.includes(kw.toLowerCase()));
    if (idx !== -1) return columns[idx];
  }
  return null;
}

function detectImportantColumns() {
  colULTG = findColumn(['ultg']);
  colUPT = findColumn(['upt']);
  colGI = findColumn(['gardu induk', 'gi']);
  colBay = findColumn(['bay']);
  colPenyedia = findColumn(['penyedia pasang', 'penyedia jasa']);
  colMaterial = columns[7] || null;   // kolom H
  colPabrikan = columns[1] || null;   // kolom B
  colAHI = findColumn(['ahi']);
  colJumlah = findColumn(['jumlah mtu', 'jumlah']);
  colTerpasang = findColumn(['terpasang', 'sudah']);
  colBelum = findColumn(['belum terpasang', 'belum', 'sisa']);
  colStatus = findColumn(['status', 'keterangan']);
}

function buildDisplayColumns() {
  let cols = columns.filter(c => c !== colUPT && c !== colPabrikan);
  if (colPabrikan) {
    if (colBay) {
      const bayIdx = cols.indexOf(colBay);
      if (bayIdx !== -1) cols.splice(bayIdx + 1, 0, colPabrikan);
      else cols.unshift(colPabrikan);
    } else {
      cols.unshift(colPabrikan);
    }
  }
  displayColumns = cols;
}

function initDashboard() {
  populateAllFilters();
  renderStats();
  renderCharts();
  renderTable();
  attachListeners();
  setupAxisLockedScroll();
  setupScrollTopButton();
}

function getUniqueValues(data, col) {
  if (!col) return [];
  return [...new Set(data.map(r => r[col]).filter(v => v !== '' && v !== null && v !== undefined))]
    .sort((a, b) => String(a).localeCompare(String(b), 'id'));
}

function populateSelect(selectId, values, defaultLabel, currentValue) {
  const sel = document.getElementById(selectId);
  sel.innerHTML = `<option value="">${defaultLabel}</option>`;
  values.forEach(v => {
    const opt = document.createElement('option');
    opt.value = v; opt.textContent = v;
    sel.appendChild(opt);
  });
  sel.value = (currentValue && values.includes(currentValue)) ? currentValue : '';
}

function getScopeForLevel(level) {
  let scope = allData;
  const ultgVal = document.getElementById('filterULTG').value;
  const giVal = document.getElementById('filterGI').value;
  const penyediaVal = document.getElementById('filterPenyedia').value;
  const materialVal = document.getElementById('filterMaterial').value;
  const pabrikanVal = document.getElementById('filterPabrikan').value;
  if (level >= 1 && ultgVal && colULTG) scope = scope.filter(r => r[colULTG] === ultgVal);
  if (level >= 2 && giVal && colGI) scope = scope.filter(r => r[colGI] === giVal);
  if (level >= 3 && penyediaVal && colPenyedia) scope = scope.filter(r => r[colPenyedia] === penyediaVal);
  if (level >= 4 && materialVal && colMaterial) scope = scope.filter(r => r[colMaterial] === materialVal);
  if (level >= 5 && pabrikanVal && colPabrikan) scope = scope.filter(r => r[colPabrikan] === pabrikanVal);
  return scope;
}

function populateULTG() {
  const sel = document.getElementById('filterULTG');
  populateSelect('filterULTG', getUniqueValues(allData, colULTG), 'Semua ULTG', sel.value);
  sel.disabled = !colULTG;
}
function populateGI() {
  const sel = document.getElementById('filterGI');
  populateSelect('filterGI', getUniqueValues(getScopeForLevel(1), colGI), 'Semua GI', sel.value);
  sel.disabled = !colGI;
}
function populatePenyedia() {
  const sel = document.getElementById('filterPenyedia');
  populateSelect('filterPenyedia', getUniqueValues(getScopeForLevel(2), colPenyedia), 'Semua Penyedia', sel.value);
  sel.disabled = !colPenyedia;
}
function populateMaterial() {
  const sel = document.getElementById('filterMaterial');
  populateSelect('filterMaterial', getUniqueValues(getScopeForLevel(3), colMaterial), 'Semua Material', sel.value);
  sel.disabled = !colMaterial;
}
function populatePabrikan() {
  const sel = document.getElementById('filterPabrikan');
  populateSelect('filterPabrikan', getUniqueValues(getScopeForLevel(4), colPabrikan), 'Semua Pabrikan', sel.value);
  sel.disabled = !colPabrikan;
}
function populateAHI() {
  const sel = document.getElementById('filterAHI');
  populateSelect('filterAHI', getUniqueValues(getScopeForLevel(5), colAHI), 'Semua AHI', sel.value);
  sel.disabled = !colAHI;
}
function populateAllFilters() {
  populateULTG(); populateGI(); populatePenyedia(); populateMaterial(); populatePabrikan(); populateAHI();
}

function renderStats() {
  const sumJumlah = sumColumn(colJumlah);
  const sumPasang = sumColumn(colTerpasang);
  const sumBelum = sumColumn(colBelum);
  document.getElementById('statsGrid').innerHTML = `
    ${colJumlah ? `<div class="stat-card primary"><div class="label">JUMLAH MTU</div><div class="value">${sumJumlah.toLocaleString('id-ID')}</div></div>` : ''}
    ${colTerpasang ? `<div class="stat-card success"><div class="label">SUDAH TERPASANG</div><div class="value">${sumPasang.toLocaleString('id-ID')}</div></div>` : ''}
    ${colBelum ? `<div class="stat-card warning"><div class="label">BELUM TERPASANG</div><div class="value">${sumBelum.toLocaleString('id-ID')}</div></div>` : ''}
  `;
}

function sumColumn(col) {
  if (!col) return 0;
  return filteredData.reduce((sum, r) => {
    const v = parseFloat(String(r[col]).replace(/[^\d.-]/g, ''));
    return sum + (isNaN(v) ? 0 : v);
  }, 0);
}

function renderCharts() {
  const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
  const textColor = isDark ? '#f1f5f9' : '#1a1f36';
  const gridColor = isDark ? '#334155' : '#e5e7eb';
  Chart.defaults.color = textColor;
  Chart.defaults.borderColor = gridColor;

  const barCol = colULTG || colPenyedia || displayColumns[0];
  const barData = countByColumn(barCol);
  if (barChart) barChart.destroy();
  barChart = new Chart(document.getElementById('barChart').getContext('2d'), {
    type: 'bar',
    data: {
      labels: Object.keys(barData),
      datasets: [{ label: `Jumlah per ${barCol}`, data: Object.values(barData), backgroundColor: '#3b82f6', borderRadius: 6 }]
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: { legend: { display: false } },
      scales: { y: { beginAtZero: true, grid: { color: gridColor } }, x: { grid: { display: false } } }
    }
  });

  const pieCol = colStatus || colPenyedia || displayColumns[1] || displayColumns[0];
  const pieData = countByColumn(pieCol);
  if (pieChart) pieChart.destroy();
  pieChart = new Chart(document.getElementById('pieChart').getContext('2d'), {
    type: 'doughnut',
    data: {
      labels: Object.keys(pieData),
      datasets: [{
        data: Object.values(pieData),
        backgroundColor: ['#3b82f6','#22c55e','#f59e0b','#ef4444','#8b5cf6','#06b6d4','#ec4899','#84cc16','#f97316','#6366f1'],
        borderWidth: 2, borderColor: isDark ? '#1e293b' : '#fff'
      }]
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: { legend: { position: 'right', labels: { boxWidth: 12, padding: 8, font: { size: 11 } } } }
    }
  });
}

function countByColumn(col) {
  if (!col) return {};
  const counts = {};
  filteredData.forEach(r => {
    const v = r[col];
    if (v !== '' && v !== null && v !== undefined) counts[v] = (counts[v] || 0) + 1;
  });
  return Object.fromEntries(Object.entries(counts).sort((a,b) => b[1] - a[1]).slice(0, 10));
}

function renderTable() {
  const headerRow = document.getElementById('tableHeaderRow');
  const tbody = document.getElementById('tableBody');

  if (headerRow.children.length === 0) {
    displayColumns.forEach(col => {
      const th = document.createElement('th');
      th.innerHTML = `${col}<span class="sort-icon">↕</span>`;
      th.dataset.column = col;
      th.addEventListener('click', () => handleSort(col));
      headerRow.appendChild(th);
    });
  }
  Array.from(headerRow.children).forEach(th => {
    th.classList.remove('sort-asc', 'sort-desc');
    const icon = th.querySelector('.sort-icon');
    if (th.dataset.column === sortColumn) {
      th.classList.add(sortDirection === 'asc' ? 'sort-asc' : 'sort-desc');
      icon.textContent = sortDirection === 'asc' ? '↑' : '↓';
    } else { icon.textContent = '↕'; }
  });

  const start = (currentPage - 1) * ROWS_PER_PAGE;
  const end = start + ROWS_PER_PAGE;
  const pageData = filteredData.slice(start, end);

  tbody.innerHTML = '';
  pageData.forEach(row => {
    const tr = document.createElement('tr');

    tr.addEventListener('click', () => {
      const wasSelected = tr.classList.contains('row-selected');
      tbody.querySelectorAll('tr.row-selected').forEach(r => r.classList.remove('row-selected'));
      if (!wasSelected) tr.classList.add('row-selected');
    });

    if (colStatus && row[colStatus]) {
      const sv = String(row[colStatus]).toLowerCase();
      if (sv.includes('kritis') || sv.includes('masalah') || sv.includes('telat') || sv.includes('terlambat') || sv.includes('gagal')) {
        tr.classList.add('highlight-danger');
      }
    }
    if (colBelum && row[colBelum]) {
      const bv = parseFloat(String(row[colBelum]).replace(/[^\d.-]/g, ''));
      if (bv > 0 && !tr.classList.contains('highlight-danger')) tr.classList.add('highlight-warning');
    }

    displayColumns.forEach(col => {
      const td = document.createElement('td');
      const val = row[col];
      td.textContent = (val === '' || val === null || val === undefined) ? '-' : val;
      tr.appendChild(td);
    });
    tbody.appendChild(tr);
  });

  document.getElementById('tableInfo').textContent =
    `Menampilkan ${filteredData.length === 0 ? 0 : start + 1}-${Math.min(end, filteredData.length)} dari ${filteredData.length} data`;
  const totalPages = Math.max(1, Math.ceil(filteredData.length / ROWS_PER_PAGE));
  document.getElementById('paginationInfo').textContent = `Halaman ${currentPage} dari ${totalPages}`;
  document.getElementById('prevPage').disabled = currentPage === 1;
  document.getElementById('nextPage').disabled = currentPage >= totalPages;
}

function handleSort(col) {
  if (sortColumn === col) sortDirection = sortDirection === 'asc' ? 'desc' : 'asc';
  else { sortColumn = col; sortDirection = 'asc'; }
  filteredData.sort((a, b) => {
    const va = a[col], vb = b[col];
    const na = parseFloat(String(va).replace(/[^\d.-]/g, ''));
    const nb = parseFloat(String(vb).replace(/[^\d.-]/g, ''));
    if (!isNaN(na) && !isNaN(nb)) return sortDirection === 'asc' ? na - nb : nb - na;
    const sa = String(va).toLowerCase(), sb = String(vb).toLowerCase();
    if (sa < sb) return sortDirection === 'asc' ? -1 : 1;
    if (sa > sb) return sortDirection === 'asc' ? 1 : -1;
    return 0;
  });
  currentPage = 1;
  renderTable();
}

function applyFilters() {
  const ultgVal = document.getElementById('filterULTG').value;
  const giVal = document.getElementById('filterGI').value;
  const penyediaVal = document.getElementById('filterPenyedia').value;
  const materialVal = document.getElementById('filterMaterial').value;
  const pabrikanVal = document.getElementById('filterPabrikan').value;
  const ahiVal = document.getElementById('filterAHI').value;

  filteredData = allData.filter(row => {
    if (ultgVal && colULTG && row[colULTG] !== ultgVal) return false;
    if (giVal && colGI && row[colGI] !== giVal) return false;
    if (penyediaVal && colPenyedia && row[colPenyedia] !== penyediaVal) return false;
    if (materialVal && colMaterial && row[colMaterial] !== materialVal) return false;
    if (pabrikanVal && colPabrikan && row[colPabrikan] !== pabrikanVal) return false;
    if (ahiVal && colAHI && row[colAHI] !== ahiVal) return false;
    return true;
  });

  currentPage = 1;
  renderStats();
  renderCharts();
  renderTable();
}

function attachListeners() {
  document.getElementById('filterULTG').addEventListener('change', () => {
    ['filterGI','filterPenyedia','filterMaterial','filterPabrikan','filterAHI'].forEach(id => document.getElementById(id).value = '');
    populateGI(); populatePenyedia(); populateMaterial(); populatePabrikan(); populateAHI();
    applyFilters();
  });
  document.getElementById('filterGI').addEventListener('change', () => {
    ['filterPenyedia','filterMaterial','filterPabrikan','filterAHI'].forEach(id => document.getElementById(id).value = '');
    populatePenyedia(); populateMaterial(); populatePabrikan(); populateAHI();
    applyFilters();
  });
  document.getElementById('filterPenyedia').addEventListener('change', () => {
    ['filterMaterial','filterPabrikan','filterAHI'].forEach(id => document.getElementById(id).value = '');
    populateMaterial(); populatePabrikan(); populateAHI();
    applyFilters();
  });
  document.getElementById('filterMaterial').addEventListener('change', () => {
    ['filterPabrikan','filterAHI'].forEach(id => document.getElementById(id).value = '');
    populatePabrikan(); populateAHI();
    applyFilters();
  });
  document.getElementById('filterPabrikan').addEventListener('change', () => {
    document.getElementById('filterAHI').value = '';
    populateAHI();
    applyFilters();
  });
  document.getElementById('filterAHI').addEventListener('change', applyFilters);

  document.getElementById('resetFilters').addEventListener('click', () => {
    ['filterULTG','filterGI','filterPenyedia','filterMaterial','filterPabrikan','filterAHI']
      .forEach(id => document.getElementById(id).value = '');
    populateAllFilters();
    applyFilters();
  });

  document.getElementById('prevPage').addEventListener('click', () => {
    if (currentPage > 1) { currentPage--; renderTable(); }
  });
  document.getElementById('nextPage').addEventListener('click', () => {
    const totalPages = Math.ceil(filteredData.length / ROWS_PER_PAGE);
    if (currentPage < totalPages) { currentPage++; renderTable(); }
  });
  document.getElementById('refreshBtn').addEventListener('click', loadData);
}

/* Axis-locked scroll untuk container tabel */
function setupAxisLockedScroll() {
  const el = document.getElementById('tableScroll');
  if (!el) return;

  let touchStartX = 0, touchStartY = 0;
  let lockedAxis = null;
  let startScrollLeft = 0, startScrollTop = 0;

  el.addEventListener('touchstart', (e) => {
    if (e.touches.length !== 1) return;
    touchStartX = e.touches[0].clientX;
    touchStartY = e.touches[0].clientY;
    startScrollLeft = el.scrollLeft;
    startScrollTop = el.scrollTop;
    lockedAxis = null;
  }, { passive: true });

  el.addEventListener('touchmove', (e) => {
    if (e.touches.length !== 1) return;
    const dx = e.touches[0].clientX - touchStartX;
    const dy = e.touches[0].clientY - touchStartY;

    if (lockedAxis === null) {
      if (Math.abs(dx) > 8 || Math.abs(dy) > 8) {
        lockedAxis = Math.abs(dx) > Math.abs(dy) ? 'x' : 'y';
      } else {
        return;
      }
    }

    if (lockedAxis === 'x') {
      el.scrollLeft = startScrollLeft - dx;
      el.scrollTop = startScrollTop;
      e.preventDefault();
    } else {
      el.scrollTop = startScrollTop - dy;
      el.scrollLeft = startScrollLeft;
      e.preventDefault();
    }
  }, { passive: false });

  el.addEventListener('touchend', () => { lockedAxis = null; });
  el.addEventListener('touchcancel', () => { lockedAxis = null; });
}

/* Scroll-to-top button — muncul setelah scroll > 300px */
function setupScrollTopButton() {
  const btn = document.getElementById('scrollTopBtn');
  if (!btn) return;

  const SHOW_THRESHOLD = 300; // px
  let ticking = false;

  function update() {
    if (window.scrollY > SHOW_THRESHOLD) btn.classList.add('visible');
    else btn.classList.remove('visible');
    ticking = false;
  }

  window.addEventListener('scroll', () => {
    if (!ticking) {
      requestAnimationFrame(update);
      ticking = true;
    }
  }, { passive: true });

  btn.addEventListener('click', () => {
    window.scrollTo({ top: 0, behavior: 'smooth' });
  });

  update();
}

const themeToggle = document.getElementById('themeToggle');
applyTheme(localStorage.getItem('theme') || 'light');
themeToggle.addEventListener('click', () => {
  const next = (document.documentElement.getAttribute('data-theme') || 'light') === 'dark' ? 'light' : 'dark';
  applyTheme(next);
  localStorage.setItem('theme', next);
  if (allData.length) renderCharts();
});
function applyTheme(theme) {
  document.documentElement.setAttribute('data-theme', theme);
  themeToggle.textContent = theme === 'dark' ? '☀️ Light' : '🌙 Dark';
}

loadData();
